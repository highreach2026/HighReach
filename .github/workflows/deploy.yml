name: Deploy High Reach Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Pages Exist
        run: |
          for file in index.html career.html contact.html 404.html vercel.json; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing!"
              exit 1
            fi
          done
          echo "All core pages verified successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
