<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | High Reach</title>

    <link rel="stylesheet" href="assets/css/highreach-core.css?v=1.1">
    <link rel="stylesheet" href="assets/css/high-reach.css?v=9.9">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050608;
            color: #ffffff;
        }

        body {
            overflow-x: hidden;
        }

        .hr-404 {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            overflow: hidden;

            background:
                radial-gradient(circle at 18% 78%,
                    rgba(255, 214, 10, 0.16),
                    transparent 30%),
                radial-gradient(circle at 40% 68%,
                    rgba(166, 236, 106, 0.18),
                    transparent 34%),
                radial-gradient(circle at 62% 62%,
                    rgba(54, 194, 176, 0.17),
                    transparent 34%),
                radial-gradient(circle at 82% 72%,
                    rgba(0, 98, 243, 0.18),
                    transparent 32%),
                #050608;
        }

        .hr-404::before {
            content: "";
            position: absolute;
            width: min(900px, 85vw);
            height: min(900px, 85vw);
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    rgba(255, 214, 10, 0.12),
                    rgba(166, 236, 106, 0.11),
                    rgba(54, 194, 176, 0.12),
                    rgba(0, 98, 243, 0.13),
                    rgba(255, 214, 10, 0.12));
            filter: blur(90px);
            animation: hr404Rotate 16s linear infinite;
            pointer-events: none;
        }

        .hr-404::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px);
            background-size: 70px 100%;
            opacity: 0.25;
            pointer-events: none;
        }

        @keyframes hr404Rotate {
            from {
                transform: rotate(0deg) scale(1);
            }

            to {
                transform: rotate(360deg) scale(1.05);
            }
        }

        .hr-404__inner {
            position: relative;
            z-index: 3;
            width: min(920px, 100%);
        }

        .hr-404__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.8;
        }

        .hr-404__eyebrow::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: rotate(45deg);
            background: linear-gradient(135deg,
                    #FFD60A 0%,
                    #A6EC6A 33%,
                    #36C2B0 66%,
                    #0062F3 100%);
        }

        .hr-404__number {
            margin: 0;
            font-size: clamp(110px, 19vw, 260px);
            font-weight: 700;
            line-height: 0.78;
            letter-spacing: -0.05em;

            background: linear-gradient(90deg,
                    #FFD60A 0%,
                    #A6EC6A 30%,
                    #36C2B0 60%,
                    #0062F3 100%);

            background-size: 220% 220%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: hr404Gradient 7s ease-in-out infinite alternate;

            filter:
                drop-shadow(0 0 28px rgba(54, 194, 176, 0.12)) drop-shadow(0 0 45px rgba(0, 98, 243, 0.08));
        }

        @keyframes hr404Gradient {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .hr-404__title {
            margin: 30px auto 16px;
            max-width: 900px;

            font-size: clamp(34px, 5vw, 72px);
            line-height: 1.02;
            font-weight: 700;
            letter-spacing: -0.03em;

            color: #ffffff;
        }

        .hr-404__title span {
            background: linear-gradient(90deg,
                    #FFD60A,
                    #A6EC6A,
                    #36C2B0,
                    #0062F3);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hr-404__text {
            max-width: 680px;
            margin: 0 auto 34px;

            font-size: clamp(16px, 1.5vw, 19px);
            line-height: 1.7;

            color: rgba(255, 255, 255, 0.66);
        }

        .hr-404__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            min-width: 220px;

            padding: 17px 30px;

            border-radius: 999px;

            background:
                linear-gradient(90deg,
                    #0062F3,
                    #36C2B0,
                    #A6EC6A,
                    #FFD60A);

            background-size: 220% 220%;

            color: #000000;
            text-decoration: none;

            font-weight: 700;
            font-size: 15px;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            animation: hr404ButtonGradient 6s ease-in-out infinite alternate;

            box-shadow:
                0 14px 40px rgba(0, 98, 243, 0.15);
        }

        .hr-404__button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 18px 50px rgba(54, 194, 176, 0.18);
        }

        .hr-404__button span {
            width: 34px;
            height: 34px;
            border-radius: 50%;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.14);

            font-size: 18px;
        }

        @keyframes hr404ButtonGradient {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .hr-404__orb {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .hr-404__orb--1 {
            width: 34px;
            height: 34px;
            top: 18%;
            left: 13%;

            border-color: #0062F3;
        }

        .hr-404__orb--2 {
            width: 18px;
            height: 18px;
            bottom: 16%;
            right: 16%;

            background: #36C2B0;
            border: 0;
            opacity: 0.7;
        }

        .hr-404__orb--3 {
            width: 12px;
            height: 12px;
            top: 28%;
            right: 20%;

            background: #FFD60A;
            border: 0;
            opacity: 0.8;
        }

        @media (max-width: 767px) {
            .hr-404 {
                padding: 50px 20px;
            }

            .hr-404__title {
                margin-top: 24px;
            }

            .hr-404__text {
                margin-bottom: 28px;
            }

            .hr-404__button {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <div class="preloader">
        <div class="preloader__image" style="background-image: url(assets/images/loader.png);"></div>
    </div>

    <main class="hr-404">

        <span class="hr-404__orb hr-404__orb--1"></span>
        <span class="hr-404__orb hr-404__orb--2"></span>
        <span class="hr-404__orb hr-404__orb--3"></span>

        <div class="hr-404__inner">

            <div class="hr-404__eyebrow">
                PAGE NOT FOUND
            </div>

            <div class="hr-404__number">
                404
            </div>

            <h1 class="hr-404__title">
                Looks Like You've
                <span>Reached Too Far.</span>
            </h1>

            <p class="hr-404__text">
                The page you're looking for doesn't exist or may have moved.
                Let's take you back to High Reach and keep moving forward.
            </p>

            <a href="index.html" class="hr-404__button">
                BACK TO HOME
                <span>→</span>
            </a>

        </div>
    </main>

    <!-- Interactive WhatsApp Admin Widget -->
    <script src="assets/js/whatsapp-widget.js"></script>

    <!-- Preloader and Smooth Page Transition -->
    <script>
        (function () {
            var loader = document.querySelector('.preloader');
            function hideLoader() {
                if (loader && !loader.classList.contains('hr-preloader-hidden')) {
                    loader.style.opacity = '0';
                    loader.style.transition = 'opacity 0.3s ease';
                    setTimeout(function () {
                        loader.classList.add('hr-preloader-hidden');
                        loader.style.display = 'none';
                    }, 300);
                }
            }
            window.addEventListener('load', hideLoader);
            setTimeout(hideLoader, 1200);
            window.addEventListener('pageshow', hideLoader);

            document.addEventListener('click', function (e) {
                var a = e.target.closest('a');
                if (a && a.getAttribute('href') && !a.getAttribute('href').startsWith('http') && !a.getAttribute('href').startsWith('#') && !a.getAttribute('href').startsWith('tel:') && !a.getAttribute('href').startsWith('mailto:')) {
                    var href = a.getAttribute('href');
                    e.preventDefault();
                    if (loader) {
                        loader.classList.remove('hr-preloader-hidden');
                        loader.style.display = 'flex';
                        loader.style.opacity = '1';
                        loader.style.pointerEvents = 'auto';
                    }
                    setTimeout(function () {
                        window.location.href = href;
                    }, 60);
                }
            });
        })();
    </script>
    <!-- High Reach Interactive Glass Effect Script -->
    <script src="assets/js/hr-glass-loupe.js?v=8.0"></script>
</body>

</html>
